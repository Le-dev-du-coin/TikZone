[project]
name = "mikroot-backend"
version = "0.1.0"
description = "Backend Core API pour la plateforme SaaS Mikroot (Gestion MikroTik Hotspot & VPN)"
authors = [
    {name = "Mikroot Team"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-cors-headers>=4.6,<5.0",
    "python-decouple>=3.8,<4.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.0",
    "playwright>=1.49.0",
    "cryptography (>=50.0.1,<51.0.0)",
    "routeros-api (>=0.21.0,<0.22.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-django = "^4.9.0"
black = "^24.10.0"
isort = "^5.13.0"
flake8 = "^7.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
